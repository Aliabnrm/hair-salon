name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: API quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package manager
        run: node -e "const { packageManager } = require('./package.json'); const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding:'utf8' }).trim(); if (packageManager !== 'npm@' + actual) process.exit(1);"

      - name: Install locked dependencies
        run: npm ci

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Build, typecheck, lint, format and test
        run: npm run check
